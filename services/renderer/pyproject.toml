[project]
name = "math-vis-renderer"
version = "0.1.0"
description = "Celery worker stub for Manim Community renders."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.36.16",
    "celery[redis]==5.4.0",
    "psycopg[binary]==3.2.13",
    "redis==5.2.1",
    "sqlalchemy==2.0.37",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
