[project]
name = "math-vis-api"
version = "0.1.0"
description = "FastAPI service for math-vis job metadata and health."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "boto3==1.36.16",
    "celery[redis]==5.4.0",
    "fastapi==0.115.8",
    "psycopg[binary]==3.2.4",
    "pydantic-settings==2.7.1",
    "pydantic==2.10.6",
    "redis==5.2.1",
    "sqlalchemy==2.0.37",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
